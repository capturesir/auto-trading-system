[project]
name = "auto-trading-system"
version = "0.1.0"
description = "Personal auto-trading system: research signals, strategy specs, risk gate, and IBKR execution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
  "exchange-calendars>=4.5",
]

[project.scripts]
auto-trading = "auto_trading.cli:main"
trade = "auto_trading.cli_trade:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]
dashboard = [
  "plotly>=5.24",
]
ibkr = [
  "ib_async>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["auto_trading", "tests"]
